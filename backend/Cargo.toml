[package]
name = "ai-football-coach-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
