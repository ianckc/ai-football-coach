type: command/shell
typeVersion: 2026.02.09.1
id: abed6657-018f-4130-874d-1b55a6742bb9
name: show-agents-contract
version: 1
tags: {}
globalArguments: {}
methods:
  execute:
    arguments:
      workingDir: .
      timeout: 60000
      run: |
        set -euo pipefail
        echo "=== Factory contract (AGENTS.md) ==="
        echo
        cat AGENTS.md
        echo
        echo "=== Agent constraints ==="
        for f in agent-constraints/*.md; do
          [ -f "$f" ] || continue
          echo
          echo "--- $f ---"
          cat "$f"
        done
